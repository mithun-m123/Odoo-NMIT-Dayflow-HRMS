<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dayflow | Sign In</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="login-page">

    <section class="login-brand">
        <div class="brand">
            <div class="brand-mark">D</div>
            Dayflow
        </div>

        <div class="brand-copy">
            <h1>Work feels better <span>in flow.</span></h1>
            <p>
                A modern employee experience that brings attendance,
                leave, payroll and workflow into one intelligent space.
            </p>
        </div>

        <div class="login-stats">
            <div>
                <strong>01</strong>
                <span>One workspace</span>
            </div>
            <div>
                <strong>24/7</strong>
                <span>Employee access</span>
            </div>
        </div>
    </section>

    <section class="login-form-area">
        <div class="login-card">

            <span class="section-kicker">WELCOME BACK</span>
            <h2>Sign in to Dayflow</h2>
            <p>Start your workday with clarity.</p>

            <form id="loginForm">

                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="employee@dayflow.com" required>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Enter password" required>
                </div>

                <button class="primary-btn full-btn" type="submit">
                    Enter Dayflow →
                </button>

            </form>

            <div class="demo-box">
                Demo: employee@dayflow.com / Password!123
            </div>

        </div>
    </section>

</div>

<script src="js/login.js"></script>

</body>
</html>
